name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Claves públicas (publishable): pueden ir en el repo. Los datos están protegidos por RLS.
      VITE_SUPABASE_URL: https://vlvjqhpgjibqdapwkoft.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_x86TC108SLRdTLvDYFiJcQ_72v-ZNev
      VITE_CHESSCOM_USERNAME: hustlehard619
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
